# Codex metadata. Onboarding runs only when asked for explicitly ($flow:onboard).
interface:
  display_name: "Flow: onboard"
  short_description: "Set up the Linear → PR flow for a repo or a teammate"
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: "mcp"
      value: "linear"
      description: "Linear MCP server: issues, workflow statuses, comments"
      transport: "streamable_http"
      url: "https://mcp.linear.app/mcp"
